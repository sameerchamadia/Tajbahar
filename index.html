<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Taj Bahar — Premium Indian Basmati Rice Exporter. Authentic, aged, long-grain basmati rice sourced from the finest fields of India. Export-quality basmati rice for wholesalers and distributors worldwide.">
<meta name="keywords" content="basmati rice, Indian rice exporter, premium basmati rice, 1121 basmati, aged basmati, rice wholesale">
<title>Taj Bahar — The Essence of Royal Basmati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8D5A3;
    --gold-dark: #8B6914;
    --emerald: #1B4332;
    --emerald-mid: #2D6A4F;
    --emerald-light: #52B788;
    --ivory: #F8F4EC;
    --ivory-warm: #EDE5D5;
    --maroon: #6B1E2C;
    --maroon-light: #9B3D4A;
    --dark: #0D1F16;
    --dark-mid: #162B1E;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--dark);
    color: var(--ivory);
    overflow-x: hidden;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--dark); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 2px; }

  /* ── Navigation ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.4rem 4rem;
    transition: background 0.6s ease, padding 0.4s ease;
  }
  nav.scrolled {
    background: rgba(13, 31, 22, 0.97);
    backdrop-filter: blur(12px);
    padding: 1rem 4rem;
    border-bottom: 1px solid rgba(201,168,76,0.15);
  }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.08em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--ivory); }
  .nav-links {
    display: flex; gap: 2.5rem; list-style: none;
  }
  .nav-links a {
    font-size: 0.7rem; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ivory-warm); text-decoration: none; opacity: 0.8;
    transition: opacity 0.3s, color 0.3s;
  }
  .nav-links a:hover { opacity: 1; color: var(--gold); }
  .nav-cta {
    font-size: 0.65rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); border: 1px solid rgba(201,168,76,0.4);
    padding: 0.6rem 1.4rem; text-decoration: none;
    transition: background 0.3s, color 0.3s;
  }
  .nav-cta:hover { background: var(--gold); color: var(--dark); }

  /* ── Hero ── */
  #hero {
    position: relative; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; text-align: center;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 60%, rgba(43,105,77,0.35) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, rgba(107,30,44,0.2) 0%, transparent 50%),
                linear-gradient(180deg, #0D1F16 0%, #0a1a11 100%);
  }
  /* Mughal arch SVG pattern background */
  .hero-pattern {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: url("data:image/svg+xml,%3Csvg width='120' height='160' viewBox='0 0 120 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 10 Q20 10 20 60 L20 130 Q20 150 60 150 Q100 150 100 130 L100 60 Q100 10 60 10Z' fill='none' stroke='%23C9A84C' stroke-width='0.8'/%3E%3Ccircle cx='60' cy='55' r='18' fill='none' stroke='%23C9A84C' stroke-width='0.5'/%3E%3Cpath d='M42 55 Q60 37 78 55' fill='none' stroke='%23C9A84C' stroke-width='0.5'/%3E%3Cpath d='M30 10 L30 0 M90 10 L90 0' stroke='%23C9A84C' stroke-width='0.4'/%3E%3Cpath d='M60 155 L60 165' stroke='%23C9A84C' stroke-width='0.4'/%3E%3C/svg%3E");
    background-size: 120px 160px;
    animation: patternDrift 40s linear infinite;
  }
  @keyframes patternDrift { from { background-position: 0 0; } to { background-position: 120px 160px; } }

  /* floating geometric ornament */
  .hero-ornament {
    position: absolute; width: 500px; height: 500px;
    border: 1px solid rgba(201,168,76,0.08);
    border-radius: 50%; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: ornamentSpin 80s linear infinite;
  }
  .hero-ornament::after {
    content: ''; position: absolute; inset: 30px;
    border: 1px solid rgba(201,168,76,0.06);
    border-radius: 50%;
  }
  @keyframes ornamentSpin { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }

  /* Rice grain particles */
  .particle {
    position: absolute; width: 3px; border-radius: 50px;
    background: linear-gradient(to bottom, rgba(201,168,76,0.6), rgba(201,168,76,0.1));
    animation: grainFloat linear infinite;
    pointer-events: none;
  }
  @keyframes grainFloat {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-10vh) rotate(180deg); opacity: 0; }
  }

  .hero-content { position: relative; z-index: 2; padding: 0 2rem; }
  .hero-pretitle {
    font-size: 0.62rem; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 1.8rem; opacity: 0;
    animation: fadeSlideUp 1s ease 0.3s forwards;
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.2rem, 7vw, 6.5rem);
    font-weight: 300; line-height: 1.08;
    color: var(--ivory); margin-bottom: 0.3rem;
    opacity: 0; animation: fadeSlideUp 1.2s ease 0.5s forwards;
  }
  .hero-title em {
    font-style: italic; color: var(--gold);
    display: block;
  }
  .hero-tagline {
    font-size: clamp(0.75rem, 1.5vw, 0.9rem);
    font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(232,213,163,0.7); margin: 2rem auto 3rem;
    max-width: 400px; line-height: 2;
    opacity: 0; animation: fadeSlideUp 1.2s ease 0.8s forwards;
  }
  .hero-divider {
    width: 60px; height: 1px; background: var(--gold);
    margin: 0 auto 2rem; opacity: 0;
    animation: fadeSlideUp 1s ease 0.7s forwards;
  }
  .hero-cta {
    display: inline-block;
    font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--dark); background: var(--gold);
    padding: 1rem 2.8rem; text-decoration: none;
    position: relative; overflow: hidden;
    transition: box-shadow 0.4s;
    opacity: 0; animation: fadeSlideUp 1s ease 1.1s forwards;
  }
  .hero-cta::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: rgba(255,255,255,0.15);
    transition: left 0.4s ease;
  }
  .hero-cta:hover::before { left: 100%; }
  .hero-cta:hover { box-shadow: 0 0 30px rgba(201,168,76,0.4); }

  .hero-features {
    display: flex; gap: 3rem; margin-top: 5rem; justify-content: center;
    opacity: 0; animation: fadeSlideUp 1s ease 1.4s forwards;
  }
  .hero-feature { text-align: center; }
  .hero-feature-icon {
    width: 36px; height: 36px; margin: 0 auto 0.6rem;
    border: 1px solid rgba(201,168,76,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
  }
  .hero-feature-label {
    font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(232,213,163,0.6);
  }

  .scroll-indicator {
    position: absolute; bottom: 2.5rem; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    opacity: 0; animation: fadeIn 1s ease 2s forwards;
  }
  .scroll-indicator span {
    font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(201,168,76,0.5);
  }
  .scroll-line {
    width: 1px; height: 50px;
    background: linear-gradient(to bottom, rgba(201,168,76,0.5), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }
  @keyframes scrollPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ── Section base ── */
  section { padding: 7rem 0; }
  .container { max-width: 1140px; margin: 0 auto; padding: 0 2rem; }

  .section-label {
    font-size: 0.58rem; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 1rem;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 4vw, 3.6rem);
    font-weight: 300; line-height: 1.15; color: var(--ivory);
  }
  .section-title em { font-style: italic; color: var(--gold); }
  .section-body {
    font-size: 0.9rem; line-height: 1.9; font-weight: 300;
    color: rgba(232,213,163,0.65); max-width: 560px;
  }
  .gold-line {
    width: 40px; height: 1px; background: var(--gold);
    margin: 1.5rem 0;
  }

  /* Reveal animations */
  .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.9s ease, transform 0.9s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal-delay-1 { transition-delay: 0.15s; }
  .reveal-delay-2 { transition-delay: 0.3s; }
  .reveal-delay-3 { transition-delay: 0.45s; }
  .reveal-delay-4 { transition-delay: 0.6s; }

  /* ── Heritage ── */
  #heritage {
    background: linear-gradient(180deg, var(--dark) 0%, var(--dark-mid) 50%, var(--dark) 100%);
    position: relative; overflow: hidden;
  }
  #heritage::before {
    content: ''; position: absolute; right: -100px; top: 50%;
    transform: translateY(-50%);
    width: 600px; height: 600px;
    border: 1px solid rgba(201,168,76,0.07);
    border-radius: 50%;
  }
  #heritage::after {
    content: ''; position: absolute; right: -50px; top: 50%;
    transform: translateY(-50%);
    width: 400px; height: 400px;
    border: 1px solid rgba(201,168,76,0.05);
    border-radius: 50%;
  }
  .heritage-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6rem; align-items: center;
  }
  .heritage-visual {
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .heritage-arch {
    width: 280px; height: 380px; position: relative;
  }
  .heritage-arch svg { width: 100%; height: 100%; }
  .heritage-stats {
    margin-top: 3rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
  }
  .stat-item { border-left: 1px solid rgba(201,168,76,0.25); padding-left: 1.2rem; }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem; font-weight: 300; color: var(--gold);
  }
  .stat-label {
    font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(232,213,163,0.5); margin-top: 0.3rem;
  }

  /* ── Products ── */
  #varieties {
    background: var(--dark-mid);
    position: relative;
  }
  #varieties::before {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5 L55 30 L30 55 L5 30 Z' fill='none' stroke='%23C9A84C' stroke-width='0.3' opacity='0.3'/%3E%3C/svg%3E");
    background-size: 60px 60px; opacity: 0.04;
  }
  .varieties-header { text-align: center; margin-bottom: 4rem; }
  .varieties-header .section-body { margin: 0 auto; text-align: center; }
  .varieties-header .gold-line { margin: 1.5rem auto; }
  .products-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5px;
  }
  .product-card {
    position: relative; overflow: hidden; cursor: pointer;
    background: var(--dark);
    border: 1px solid rgba(201,168,76,0.1);
    padding: 2.5rem 2rem; text-align: center;
    transition: border-color 0.4s, background 0.4s;
  }
  .product-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(43,105,77,0.1), rgba(201,168,76,0.05));
    opacity: 0; transition: opacity 0.4s;
  }
  .product-card:hover { border-color: rgba(201,168,76,0.4); background: rgba(13,31,22,0.8); }
  .product-card:hover::before { opacity: 1; }
  .product-card:hover .product-icon { transform: scale(1.08); }
  .product-card:hover .product-shine { opacity: 1; left: 100%; }
  .product-shine {
    position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.06), transparent);
    opacity: 0; transition: left 0.6s ease, opacity 0.2s;
  }
  .product-icon {
    width: 64px; height: 80px; margin: 0 auto 1.5rem;
    transition: transform 0.4s ease;
  }
  .product-badge {
    display: inline-block; font-size: 0.55rem; letter-spacing: 0.2em;
    text-transform: uppercase; background: rgba(201,168,76,0.1);
    color: var(--gold); padding: 0.3rem 0.8rem; margin-bottom: 1rem;
    border: 1px solid rgba(201,168,76,0.2);
  }
  .product-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 400; color: var(--ivory);
    margin-bottom: 0.8rem;
  }
  .product-desc {
    font-size: 0.78rem; line-height: 1.8; font-weight: 300;
    color: rgba(232,213,163,0.5);
  }
  .product-detail {
    display: flex; justify-content: center; gap: 1.5rem; margin-top: 1.5rem;
    padding-top: 1.5rem; border-top: 1px solid rgba(201,168,76,0.1);
  }
  .product-spec { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold-light); opacity: 0.6; }

  /* ── Quality ── */
  #quality { background: var(--dark); position: relative; overflow: hidden; }
  .quality-bg-text {
    position: absolute; font-family: 'Cormorant Garamond', serif;
    font-size: 18vw; font-weight: 300; color: rgba(201,168,76,0.03);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    white-space: nowrap; pointer-events: none; user-select: none;
    letter-spacing: 0.1em;
  }
  .quality-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: start; }
  .quality-steps { display: flex; flex-direction: column; gap: 2rem; margin-top: 3rem; }
  .quality-step {
    display: flex; gap: 1.5rem; align-items: flex-start;
    padding-bottom: 2rem; border-bottom: 1px solid rgba(201,168,76,0.08);
  }
  .quality-step:last-child { border-bottom: none; }
  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 300; color: rgba(201,168,76,0.25);
    line-height: 1; min-width: 2.5rem;
  }
  .step-content h4 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem; font-weight: 400; color: var(--ivory); margin-bottom: 0.4rem;
  }
  .step-content p {
    font-size: 0.8rem; line-height: 1.8; font-weight: 300; color: rgba(232,213,163,0.5);
  }
  .cert-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 3rem;
  }
  .cert-item {
    background: rgba(201,168,76,0.05); border: 1px solid rgba(201,168,76,0.12);
    padding: 1.2rem; text-align: center;
  }
  .cert-name {
    font-size: 0.75rem; letter-spacing: 0.12em; color: var(--gold); font-weight: 400;
  }
  .cert-desc {
    font-size: 0.65rem; color: rgba(232,213,163,0.4); margin-top: 0.3rem; letter-spacing: 0.05em;
  }

  /* ── Export ── */
  #export {
    background: var(--dark-mid); position: relative; overflow: hidden;
  }
  .export-inner {
    display: flex; gap: 5rem; align-items: center;
  }
  .export-content { flex: 1; }
  .export-map { flex: 1; position: relative; }
  .world-dots {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.8rem; margin-top: 2rem;
  }
  .region-item {
    padding: 1rem; border: 1px solid rgba(201,168,76,0.1);
    background: rgba(13,31,22,0.5);
    transition: border-color 0.3s, background 0.3s;
  }
  .region-item:hover { border-color: rgba(201,168,76,0.35); background: rgba(43,105,77,0.15); }
  .region-flag { font-size: 1.3rem; margin-bottom: 0.3rem; }
  .region-name {
    font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(232,213,163,0.5);
  }
  .trust-badges { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 2.5rem; }
  .trust-badge {
    display: flex; align-items: center; gap: 0.6rem;
    border: 1px solid rgba(201,168,76,0.2); padding: 0.6rem 1rem;
    font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(232,213,163,0.7);
  }
  .trust-badge::before {
    content: '✦'; color: var(--gold); font-size: 0.5rem;
  }

  /* ── Gallery ── */
  #gallery { background: var(--dark); overflow: hidden; }
  .gallery-header { text-align: center; margin-bottom: 4rem; }
  .gallery-header .gold-line { margin: 1.5rem auto; }
  .gallery-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: 260px 260px;
    gap: 3px;
  }
  .gallery-item {
    position: relative; overflow: hidden; cursor: pointer;
  }
  .gallery-item:first-child { grid-row: 1 / 3; }
  .gallery-item-inner {
    position: absolute; inset: 0;
    transition: transform 0.8s cubic-bezier(0.25,0.1,0.25,1);
  }
  .gallery-item:hover .gallery-item-inner { transform: scale(1.05); }
  .gallery-item-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(13,31,22,0.7), transparent);
    opacity: 0; transition: opacity 0.4s;
    display: flex; align-items: flex-end; padding: 1.5rem;
  }
  .gallery-item:hover .gallery-item-overlay { opacity: 1; }
  .gallery-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem; font-style: italic; color: var(--gold-light);
  }
  /* Gallery item backgrounds (rice-themed abstract) */
  .g1 { background: linear-gradient(135deg, #1B4332 0%, #0f2a1f 50%, #2D6A4F 100%); }
  .g2 { background: linear-gradient(135deg, #2D3319 0%, #1B2210 100%); }
  .g3 { background: linear-gradient(135deg, #3D2B1F 0%, #251A13 100%); }
  .g4 { background: linear-gradient(135deg, #1A3328 0%, #0D1F16 100%); }
  .g5 { background: linear-gradient(135deg, #2B2510 0%, #1A1809 100%); }
  .gallery-pattern {
    position: absolute; inset: 0; opacity: 0.15;
    background-image: radial-gradient(circle, var(--gold) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .gallery-grain {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
  }
  .gallery-grain svg { opacity: 0.4; }

  /* ── Contact ── */
  #contact {
    background: linear-gradient(180deg, var(--dark) 0%, var(--dark-mid) 100%);
    position: relative; overflow: hidden;
  }
  #contact::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 1px; height: 80px; background: linear-gradient(to bottom, transparent, rgba(201,168,76,0.4));
  }
  .contact-inner {
    display: grid; grid-template-columns: 1fr 1.2fr; gap: 6rem; align-items: start;
  }
  .contact-form { display: flex; flex-direction: column; gap: 1rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .form-label {
    font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(232,213,163,0.5);
  }
  .form-input, .form-select, .form-textarea {
    background: rgba(201,168,76,0.04); border: 1px solid rgba(201,168,76,0.15);
    color: var(--ivory); padding: 0.9rem 1rem;
    font-family: 'Jost', sans-serif; font-size: 0.85rem; font-weight: 300;
    outline: none; transition: border-color 0.3s;
    appearance: none; -webkit-appearance: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: rgba(201,168,76,0.5);
  }
  .form-input::placeholder, .form-textarea::placeholder { color: rgba(232,213,163,0.25); }
  .form-textarea { resize: vertical; min-h
